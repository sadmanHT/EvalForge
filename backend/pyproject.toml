[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge-backend"
version = "0.2.0"
description = "EvalForge backend and worker foundation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.16.2",
  "fastapi==0.115.14",
  "psycopg[binary]==3.2.9",
  "redis==6.2.0",
  "SQLAlchemy==2.0.41",
  "uvicorn[standard]==0.34.3",
]

[project.optional-dependencies]
dev = [
  "coverage==7.9.1",
  "fakeredis==2.30.1",
  "httpx==0.28.1",
  "mypy==1.16.1",
  "pre-commit==4.2.0",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "PyYAML==6.0.2",
  "ruff==0.12.0",
]
evaluation = []
training = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires local PostgreSQL and/or Redis",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
