name: phase8-format-ece-tests

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-ece-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.12.0'
      - name: Format target and remove temporary workflow
        run: |
          cd backend
          ruff format tests/inference/test_phase8_rag_evidence.py
          cd ..
          rm .github/workflows/phase8-format-ece-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests/inference/test_phase8_rag_evidence.py .github/workflows/phase8-format-ece-tests.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git commit -m 'style: format Phase 08 ECE evidence tests'
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
