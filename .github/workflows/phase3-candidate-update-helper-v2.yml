name: phase3-candidate-update-helper-v2

on:
  push:
    branches:
      - phase3-candidate-update-helper
    paths:
      - .github/workflows/phase3-candidate-update-helper-v2.yml

permissions:
  contents: write

jobs:
  update-evidence:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out helper scripts
        uses: actions/checkout@v4
        with:
          ref: phase3-candidate-update-helper
          path: helper
          fetch-depth: 1

      - name: Check out exact Phase 03 target
        uses: actions/checkout@v4
        with:
          ref: phase-03-dataset-engineering
          path: target
          fetch-depth: 1

      - name: Verify expected parent
        shell: bash
        run: test "$(git -C target rev-parse HEAD)" = "f74a2c85a1b6242e2d72e54df04497b9b4391d0d"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: target/backend/requirements.full.lock

      - name: Extract validated run scripts from original helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path("helper/.github/workflows/phase3-candidate-update-helper.yml")
          lines = workflow.read_text(encoding="utf-8").splitlines()
          wanted = {
              "Apply public incident candidate update": "apply.sh",
              "Format touched Python": "format.sh",
              "Rebuild candidate outputs and synchronize evidence": "rebuild.sh",
              "Run focused Phase 03 coverage and refresh handoff percentage": "coverage.sh",
              "Validate Phase 03 quality and scientific gates": "quality.sh",
              "Commit verified Phase 03 candidate coverage increment": "commit.sh",
          }
          found = {}
          i = 0
          while i < len(lines):
              marker = "      - name: "
              if not lines[i].startswith(marker):
                  i += 1
                  continue
              name = lines[i][len(marker):]
              if name not in wanted:
                  i += 1
                  continue
              j = i + 1
              while j < len(lines) and lines[j] != "        run: |":
                  if lines[j].startswith(marker):
                      raise SystemExit(f"run block missing for {name}")
                  j += 1
              if j >= len(lines):
                  raise SystemExit(f"run block missing for {name}")
              j += 1
              block = []
              while j < len(lines) and not lines[j].startswith(marker):
                  line = lines[j]
                  if line.startswith("          "):
                      block.append(line[10:])
                  elif line == "":
                      block.append("")
                  else:
                      break
                  j += 1
              Path("/tmp", wanted[name]).write_text("\n".join(block).rstrip() + "\n", encoding="utf-8")
              found[name] = True
              i = j
          missing = sorted(set(wanted) - set(found))
          if missing:
              raise SystemExit(f"missing extracted helper scripts: {missing}")
          PY

      - name: Install locked backend dependencies
        working-directory: target
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend

      - name: Materialize pinned Phase 03 sources
        working-directory: target
        run: python scripts/fetch_phase3_sources.py

      - name: Apply public incident candidate update
        working-directory: target
        shell: bash
        run: bash /tmp/apply.sh

      - name: Format touched Python
        working-directory: target
        shell: bash
        run: bash /tmp/format.sh

      - name: Rebuild candidate outputs and synchronize evidence
        working-directory: target
        shell: bash
        run: bash /tmp/rebuild.sh

      - name: Run focused Phase 03 coverage and refresh handoff percentage
        working-directory: target
        shell: bash
        run: bash /tmp/coverage.sh

      - name: Validate Phase 03 quality and scientific gates
        working-directory: target
        shell: bash
        run: bash /tmp/quality.sh

      - name: Validate exact changed-file scope including untracked snapshots
        working-directory: target
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess

          changed = set(
              subprocess.check_output(["git", "diff", "--name-only"], text=True)
              .strip()
              .splitlines()
          )
          changed.update(
              subprocess.check_output(
                  ["git", "ls-files", "--others", "--exclude-standard"], text=True
              )
              .strip()
              .splitlines()
          )
          changed.discard("")
          allowed = {
              "backend/tests/data/test_phase3_data.py",
              "configs/postmortem-candidates.json",
              "scripts/check_phase3_contract.py",
              "docs/data-card.md",
              "docs/phase-03-handoff.md",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/README.md",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/SHA256SUMS.txt",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/dispatcharr-1416.snapshot.json",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/google-payment-E18Caoo5X1m6dTa1PVr1.snapshot.json",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/google-no-fault-fLYHLzSGXGkLkAjc8MJG.snapshot.json",
              "datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/manifest.json",
              "datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/public-postmortem-candidate-coverage.json",
              "datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/source-audit-report.json",
              "evidence/phase-03/README.md",
              "evidence/phase-03/candidate-manifest.json",
              "evidence/phase-03/checksums.txt",
              "evidence/phase-03/class-split-summary.json",
              "evidence/phase-03/public-postmortem-candidate-coverage.json",
              "evidence/phase-03/source-audit-report.json",
          }
          required = {
              "configs/postmortem-candidates.json",
              "backend/tests/data/test_phase3_data.py",
              "scripts/check_phase3_contract.py",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/dispatcharr-1416.snapshot.json",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/google-payment-E18Caoo5X1m6dTa1PVr1.snapshot.json",
              "datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/google-no-fault-fLYHLzSGXGkLkAjc8MJG.snapshot.json",
              "datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/manifest.json",
              "evidence/phase-03/public-postmortem-candidate-coverage.json",
          }
          unexpected = sorted(changed - allowed)
          missing = sorted(required - changed)
          if unexpected:
              raise SystemExit(f"unexpected changed files: {unexpected}")
          if missing:
              raise SystemExit(f"required files did not change: {missing}")
          print("CHANGED_FILES=" + ",".join(sorted(changed)))
          PY

      - name: Commit verified Phase 03 candidate coverage increment
        working-directory: target
        shell: bash
        run: bash /tmp/commit.sh
