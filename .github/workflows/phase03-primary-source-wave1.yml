name: phase03-primary-source-wave1

on:
  push:
    branches:
      - phase-03-primary-source-preservation

jobs:
  preserve-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-03-primary-source-preservation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Verify exact validated family-depth base ancestry
        run: git merge-base --is-ancestor 8eba31ba6c8565355413400e7c28a21bccec9698 HEAD
      - name: Install locked backend toolchain
        run: python -m pip install -r backend/requirements.full.lock
      - name: Materialize pinned Phase 03 transport sources
        run: python scripts/fetch_phase3_sources.py
      - name: Bootstrap checksum-locked primary-source wave
        env:
          PYTHONPATH: backend
        run: python scripts/preserve_phase3_primary_sources.py --bootstrap
      - name: Rebuild processed Phase 03 candidate artifacts
        env:
          PYTHONPATH: backend
        run: python scripts/build_phase3_candidate.py
      - name: Synchronize Phase 03 evidence mirrors
        run: python scripts/sync_phase3_evidence.py
      - name: Migrate preservation regression assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/data/test_phase3_data.py')
          text = path.read_text(encoding='utf-8')
          marker = '\ndef test_supported_postmortem_candidates_still_require_primary_source_snapshot() -> None:\n'
          prefix, separator, _ = text.partition(marker)
          if not separator:
              raise SystemExit('expected obsolete primary-source regression test was not found')
          replacement = '''
def test_supported_postmortem_primary_source_wave_remains_nonadmitted() -> None:
    root = Path(__file__).resolve().parents[3]
    index = load_candidate_index(root / "configs/postmortem-candidates.json")
    supported = [item for item in index.candidates if item.decision == CandidateDecision.SUPPORTED]
    assert len(supported) == 18
    assert len({item.candidate_id for item in supported}) == 18
    by_id = {item.candidate_id: item for item in supported}

    medoc = by_id["github:Nikhil-Gautam-dev:medoc-n-plus-one:2026-01-11"]
    assert medoc.evidence_repository == "Nikhil-Gautam-dev/nikhil-gautam-dev.github.io"
    assert medoc.evidence_commit == "34d1ecc14b54166608b4197c44e1e7efc82e48b6"
    assert medoc.source_blob_sha == "750ba91067e5e4d2e192a3eceffec357a58e9d77"

    preserved_ids = {
        "github:Nikhil-Gautam-dev:medoc-n-plus-one:2026-01-11",
        "github:Dispatcharr:issue-1416:2026-07-06",
        "openlibrary:issue-12432:2026-04-22:n-plus-one",
        "dify:issue-40036:2026-08-05:n-plus-one",
    }
    assert {
        item.candidate_id for item in supported if item.original_source_snapshot_preserved
    } == preserved_ids
    for candidate_id in preserved_ids:
        candidate = by_id[candidate_id]
        assert candidate.preserved_primary_source_path
        assert candidate.preserved_primary_source_sha256
        assert candidate.preserved_primary_source_kind in {"git_blob", "github_issue"}
        assert not candidate.research_admitted

    expected_normalized_snapshots = {
        "github:Dispatcharr:issue-1416:2026-07-06": "database_connection_leak",
        "google-cloud-status:E18Caoo5X1m6dTa1PVr1": "broken_payment_configuration",
        "google-cloud-status:fLYHLzSGXGkLkAjc8MJG": "no_fault",
    }
    for candidate_id, label in expected_normalized_snapshots.items():
        candidate = by_id[candidate_id]
        assert candidate.proposed_root_cause_code == label
        snapshot = (root / candidate.source_path).read_bytes()
        header = f"blob {len(snapshot)}\\0".encode()
        assert hashlib.sha1(header + snapshot).hexdigest() == candidate.source_blob_sha
        assert not candidate.research_admitted

    for candidate_id in (
        "google-cloud-status:E18Caoo5X1m6dTa1PVr1",
        "google-cloud-status:fLYHLzSGXGkLkAjc8MJG",
    ):
        assert not by_id[candidate_id].original_source_snapshot_preserved
    assert all(not item.research_admitted for item in supported)
'''
          path.write_text(prefix + replacement, encoding='utf-8')
          PY
      - name: Apply canonical Ruff fixes and formatting
        working-directory: backend
        run: |
          ruff check --fix \
            app/data/postmortems.py \
            app/data/primary_sources.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py
          ruff format \
            app/data/postmortems.py \
            app/data/primary_sources.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py
      - name: Canonical Phase 03 lint and format gate
        working-directory: backend
        run: |
          ruff check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
          ruff format --check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
      - name: Typecheck backend data layer
        working-directory: backend
        run: mypy app
      - name: Focused Phase 03 tests with coverage
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/data/test_phase3_data.py \
            backend/tests/data/test_phase3_primary_sources.py \
            --cov=app.data --cov-report=term-missing --cov-fail-under=90 -q
      - name: Verify preservation, reproducibility and contract
        env:
          PYTHONPATH: backend
        run: |
          python scripts/preserve_phase3_primary_sources.py
          python scripts/check_phase3_reproducibility.py
          python scripts/check_phase3_contract.py
      - name: Verify hard exit remains scientifically blocked
        shell: bash
        run: |
          set +e
          python scripts/check_phase3_exit.py | tee /tmp/phase03-primary-exit.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 2
          grep -q '^BLOCKER=original_source_preservation_and_research_admission_required$' /tmp/phase03-primary-exit.txt
          grep -q '^RESEARCH_TRAIN=0$' /tmp/phase03-primary-exit.txt
          grep -q '^RESEARCH_VALIDATION=0$' /tmp/phase03-primary-exit.txt
          grep -q '^RESEARCH_TEST=0$' /tmp/phase03-primary-exit.txt
      - name: Verify preservation progress is exact
        env:
          PYTHONPATH: backend
        run: |
          python scripts/preserve_phase3_primary_sources.py | tee /tmp/phase03-primary.txt
          grep -q '^PRESERVED_CANDIDATES=4$' /tmp/phase03-primary.txt
          grep -q '^PRESERVED_N_PLUS_ONE_QUERY=3$' /tmp/phase03-primary.txt
          grep -q '^PRESERVED_DATABASE_CONNECTION_LEAK=1$' /tmp/phase03-primary.txt
          grep -q '^PRESERVED_FAMILY_DEPTH_SUFFICIENT=false$' /tmp/phase03-primary.txt
      - name: Remove on-demand transport payloads
        run: |
          rm -f datasets/incident_diagnosis/raw/opssentinel/fae661fc1634aad6a3855a1dec8dcddb16a890dd/release-catalog.snapshot.json
          rm -f datasets/incident_diagnosis/raw/servicenow_uci/uci-498/incident-management-process-enriched-event-log.zip
      - name: Upload validated primary-source outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase03-primary-source-wave1
          path: |
            Makefile
            backend/app/data/postmortems.py
            backend/app/data/primary_sources.py
            backend/tests/data/test_phase3_data.py
            backend/tests/data/test_phase3_primary_sources.py
            configs/phase3-primary-sources.json
            configs/postmortem-candidates.json
            scripts/check_phase3_contract.py
            scripts/preserve_phase3_primary_sources.py
            scripts/sync_phase3_evidence.py
            datasets/incident_diagnosis/raw/public_incidents/phase3-primary-source-v1/
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/
            evidence/phase-03/
