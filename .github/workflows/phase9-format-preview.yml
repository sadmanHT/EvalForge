name: phase9-format-preview

on:
  push:
    branches:
      - phase-09-fine-tuning-system

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Show canonical Phase 09 formatting diff
        run: |
          cd backend
          ruff format --diff app/training/ tests/training/
