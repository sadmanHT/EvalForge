name: phase9-format-preview

on:
  push:
    branches:
      - phase-09-fine-tuning-system

permissions:
  contents: write

jobs:
  format-phase9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical Phase 09 formatting and remove helper
        run: |
          cd backend
          ruff format app/training/ tests/training/
          cd ..
          rm .github/workflows/phase9-format-preview.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/training backend/tests/training .github/workflows/phase9-format-preview.yml
          git commit -m "style: apply canonical Phase 09 formatting"
          git push
