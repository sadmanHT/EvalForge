name: phase8-format-indexing

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-indexing:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical formatting and remove temporary workflow
        run: |
          ruff check --fix backend/app/retrieval/indexing.py
          ruff format backend/app/retrieval/indexing.py
          rm .github/workflows/phase8-format-indexing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/retrieval/indexing.py .github/workflows/phase8-format-indexing.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: apply canonical Phase 08 indexing formatting"
          git push
