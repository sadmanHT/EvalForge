name: phase3-source-diagnostic

on:
  push:
    branches:
      - phase-03-dataset-engineering

permissions:
  contents: read

jobs:
  diagnose-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Phase 03 transport bundle
        run: |
          : > /tmp/phase3-bundle.tar.gz
          while read -r blob_sha expected_sha; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" --jq .content > /tmp/chunk.b64
            tr -d '\n' < /tmp/chunk.b64 | base64 -d > /tmp/chunk
            echo "${expected_sha}  /tmp/chunk" | sha256sum -c -
            cat /tmp/chunk >> /tmp/phase3-bundle.tar.gz
          done <<'CHUNKS'
          b32b6e7de31141140143dac34d2e832b8b57caed 7395062f9c1f8d544171af81e316c021441d1142817e0640c377fc31fd27b08d
          beea832b3061b7e8af2ad7dc8300fe52920566c6 3ed906289d9f94f516163850a65cf47fb747d050957ef462d4f33aca92fef4ce
          eaa263f65eedfe66f303f2899430d47afbc527bd 224df7c37be198f23dc1fdc7513519534a207d917d99499cfc03772beaf255d8
          f15f2e4e652ab26014bdbc175bcf253c6e3c1031 af612a4ef5f2ea78022eacfd87d6dcac00b180567a5685a9f7f58bd0bf7c117b
          e5bbb1b675da6298a75a804c52a86d7005e07a50 42d52cde36597adfc61ddac0f0e5a2bfc3c21237977d35e436cfa8845ea2931c
          17c284dbe9c3e98b226aa7f3e48ec90873c731aa f995997f3429acd279357f509e2b9ac9e09a1d05b75646e314155139b7384f2d
          ecf919efc95df2652c91cc83f1053e4a02a4d7db f2ef96f4c280e7b8f6f538120a0a6a09346428e52f18c6e6d0f3ce9f87e01bde
          350bd12c8816fcece50ab6e07ddae66be510ed3a bb2bb4a2c0a39f7c3cbce6baccc1b24cacbd636fc3223bfa96b4d708b3bb6938
          CHUNKS
          echo "78d467ea9aeecaf3a875ebfeebd521ab258941c860ae5408b6498815de349748  /tmp/phase3-bundle.tar.gz" | sha256sum -c -
      - name: Inspect current official UCI source bytes
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/uci498.zip \
            "https://archive.ics.uci.edu/static/public/498/incident+management+process+enriched+event+log.zip"
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import zipfile
          from pathlib import Path

          archive = Path('/tmp/uci498.zip')
          archive_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
              if len(names) != 1:
                  raise SystemExit(f'UCI_SOURCE_DIAGNOSTIC=FAIL members={names!r}')
              member = names[0]
              payload = zf.read(member)
          member_sha = hashlib.sha256(payload).hexdigest()
          print(f'UCI_SOURCE_DIAGNOSTIC=PASS')
          print(f'UCI_ARCHIVE_SHA256={archive_sha}')
          print(f'UCI_MEMBER_FILENAME={member}')
          print(f'UCI_MEMBER_BYTES={len(payload)}')
          print(f'UCI_MEMBER_SHA256={member_sha}')
          print('UPLOADED_ARCHIVE_SHA256=3ea92768cb2cfada908dd601b057d7066127fe75dc8fe19e4abaa1c6766a6c13')
          print('UPLOADED_MEMBER_SHA256=fd184bbfd62329cfe093e99da2ea7071905f2ead91900b448eb2635870821bef')
          print(f'UCI_MEMBER_MATCHES_UPLOADED={str(member_sha == "fd184bbfd62329cfe093e99da2ea7071905f2ead91900b448eb2635870821bef").lower()}')
          PY
