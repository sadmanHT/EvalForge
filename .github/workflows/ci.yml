name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evalforge
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalforge -d evalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://evalforge:evalforge@localhost:5432/evalforge
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Phase 03 external source
        run: python scripts/fetch_phase3_sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify committed dependency locks
        run: |
          python -m pip freeze --exclude-editable | sort > /tmp/backend.freeze
          diff -u backend/requirements.full.lock /tmp/backend.freeze
          test -f frontend/package-lock.json
      - name: Cumulative gate
        run: make verify-all
      - name: Record Phase 03 hard-exit status
        run: |
          set +e
          python scripts/check_phase3_exit.py | tee /tmp/phase03-exit.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 2 ]; then
            grep -q '^BLOCKER=independent_taxonomy_coverage_insufficient$' /tmp/phase03-exit.txt
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
      - name: Upload dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: phase03-dependency-locks
          path: |
            backend/requirements.full.lock
            frontend/package-lock.json
      - name: Upload Phase 03 dataset evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase03-dataset-evidence
          path: |
            evidence/phase-03/
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/
            docs/data-card.md
            docs/phase-03-handoff.md

  clean-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Install locked smoke client dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Fresh Compose build and smoke
        run: |
          mkdir -p /tmp/phase03-clean-environment
          docker compose down -v --remove-orphans
          docker compose build --no-cache
          docker compose up -d
          python scripts/compose_health.py | tee /tmp/phase03-clean-environment/fresh-start-smoke.log
          docker compose ps | tee /tmp/phase03-clean-environment/service-health.txt
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > /tmp/phase03-clean-environment/compose.log || true
      - name: Tear down cleanly
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload Phase 03 clean-environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase03-clean-environment
          path: /tmp/phase03-clean-environment/
