name: ci

permissions:
  contents: write

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evalforge
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalforge -d evalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://evalforge:evalforge@localhost:5432/evalforge
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install backend dependencies
        run: python -m pip install -e "./backend[dev]"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Cumulative gate
        run: make verify-all
      - name: Freeze resolved dependencies
        run: |
          python -m pip freeze --exclude-editable | sort > backend/requirements.full.lock
          test -f frontend/package-lock.json
      - name: Commit dependency locks to Phase 02 branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/phase-02-repository-foundation'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/requirements.full.lock frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCK_COMMIT=NO_CHANGES"
          else
            git commit -m "phase2: commit generated dependency locks [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
            echo "LOCK_COMMIT=PUSHED"
          fi
      - name: Upload dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: phase02-dependency-locks
          path: |
            backend/requirements.full.lock
            frontend/package-lock.json

  clean-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install smoke client dependencies
        run: python -m pip install -e "./backend"
      - name: Fresh Compose build and smoke
        run: |
          mkdir -p evidence/phase-02
          docker compose down -v --remove-orphans
          docker compose build --no-cache
          docker compose up -d
          python scripts/compose_health.py | tee evidence/phase-02/fresh-start-smoke.log
          docker compose ps | tee evidence/phase-02/service-health.txt
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > evidence/phase-02/compose.log || true
      - name: Tear down cleanly
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload fresh-start evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase02-fresh-start
          path: evidence/phase-02/
