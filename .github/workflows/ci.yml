name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "phase-*"

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evalforge
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalforge -d evalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://evalforge:evalforge@localhost:5432/evalforge
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Materialize pinned Phase 03 external source
        run: python scripts/fetch_phase3_sources.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify committed dependency locks
        run: |
          python -m pip freeze --exclude-editable | sort > /tmp/backend.freeze
          diff -u backend/requirements.full.lock /tmp/backend.freeze
          test -f frontend/package-lock.json
      - name: Cumulative gate
        run: make verify-all
      - name: Record Phase 03 hard-exit status
        run: python scripts/check_phase3_exit.py | tee /tmp/phase03-exit.txt
      - name: Record Phase 04 hard-exit status
        run: python scripts/check_phase4_exit.py | tee /tmp/phase04-exit.txt
      - name: Record Phase 05 hard-exit status
        run: python scripts/check_phase5_exit.py | tee /tmp/phase05-exit.txt
      - name: Record Phase 06 hard-exit status
        run: python scripts/check_phase6_exit.py | tee /tmp/phase06-exit.txt
      - name: Record Phase 07 retrieval contract
        run: python scripts/check_phase7_contract.py | tee /tmp/phase07-contract.txt
      - name: Record Phase 07 index and reindex evidence
        run: python scripts/index_kb.py | tee /tmp/phase07-index.txt
      - name: Record Phase 07 leakage audit
        run: |
          mkdir -p /tmp/phase07-runtime-evidence
          python scripts/audit_phase7_leakage.py --output-dir /tmp/phase07-runtime-evidence | tee /tmp/phase07-leakage-audit.txt
      - name: Record Phase 07 hard-exit status
        run: python scripts/check_phase7_exit.py | tee /tmp/phase07-exit.txt
      - name: Record Phase 08 variant indexes
        run: python scripts/index_phase8_rag_variants.py --output-dir /tmp/phase08-runtime-evidence | tee /tmp/phase08-index.txt
      - name: Record Phase 08 hard-exit status
        run: python scripts/check_phase8_exit.py | tee /tmp/phase08-exit.txt
      - name: Record Phase 09 contract status
        run: python scripts/check_phase9_contract.py | tee /tmp/phase09-contract.txt
      - name: Record Phase 09 hard-exit state without fabricating GPU evidence
        shell: bash
        run: |
          set +e
          python scripts/check_phase9_exit.py | tee /tmp/phase09-exit.txt
          phase09_status=${PIPESTATUS[0]}
          set -e
          if grep -q '^PHASE09_STAGE=pre_external_training$' /tmp/phase09-exit.txt; then
            test "$phase09_status" -eq 1
            grep -q '^PHASE09_EXIT=FAIL ' /tmp/phase09-exit.txt
          else
            test "$phase09_status" -eq 0
            grep -q '^PHASE09_EXIT=PASS$' /tmp/phase09-exit.txt
          fi
      - name: Upload dependency locks
        uses: actions/upload-artifact@v4
        with:
          name: phase05-dependency-locks
          path: |
            backend/requirements.full.lock
            frontend/package-lock.json
      - name: Upload Phase 03 dataset evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase03-dataset-evidence
          path: |
            evidence/phase-03/
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate/
            docs/data-card.md
            docs/phase-03-handoff.md
      - name: Upload Phase 04 persistence evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase04-persistence-evidence
          path: |
            /tmp/phase04-exit.txt
            evidence/phase-04/
            docs/phase-04-handoff.md
            docs/architecture.md
            backend/migrations/versions/0002_phase04_persistence.py
      - name: Upload Phase 05 evaluation evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase05-evaluation-evidence
          path: |
            /tmp/phase05-exit.txt
            evidence/phase-05/
            docs/evaluation-methodology.md
            backend/tests/fixtures/phase5/golden_metrics.json
      - name: Upload Phase 06 baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase06-baseline-evidence
          path: |
            /tmp/phase06-exit.txt
            evidence/phase-06/
            docs/phase-06-runbook.md
            docs/phase-06-handoff.md
            configs/phase6-baseline.json
            configs/phase6-gpu-host.json
      - name: Upload Phase 07 retrieval evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase07-retrieval-evidence
          path: |
            /tmp/phase07-contract.txt
            /tmp/phase07-index.txt
            /tmp/phase07-leakage-audit.txt
            /tmp/phase07-exit.txt
            /tmp/phase07-runtime-evidence/
            evidence/phase-07/
            configs/phase7-kb.json
            knowledge_base/phase7/
            backend/migrations/versions/0003_phase07_retrieval.py
      - name: Upload Phase 08 RAG evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase08-rag-evidence
          path: |
            /tmp/phase08-index.txt
            /tmp/phase08-exit.txt
            /tmp/phase08-runtime-evidence/
            evidence/phase-08/
            configs/phase8-rag.json
            configs/phase8-rag-ablations.json
            docs/phase-08-runbook.md
            docs/phase-08-handoff.md
      - name: Upload Phase 09 training-system contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase09-training-system-contract
          path: |
            /tmp/phase09-contract.txt
            /tmp/phase09-exit.txt
            evidence/phase-09/
            training/configs/lora_config.yaml
            training/configs/training_args.yaml
            training/requirements.gpu.txt
            docs/phase-09-runbook.md
            docs/phase-09-handoff.md

  clean-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Install locked smoke client dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Fresh Compose build and Phase 09 cumulative smoke
        env:
          DATABASE_URL: postgresql://evalforge:evalforge@localhost:5432/evalforge
        run: |
          mkdir -p /tmp/phase09-clean-environment
          docker compose down -v --remove-orphans
          docker compose build --no-cache
          docker compose up -d
          python scripts/compose_health.py | tee /tmp/phase09-clean-environment/fresh-start-smoke.log
          python scripts/check_phase4_exit.py | tee /tmp/phase09-clean-environment/phase04-exit.log
          python scripts/run_phase5_smoke_evaluation.py | tee /tmp/phase09-clean-environment/phase05-smoke.log
          python scripts/check_phase5_exit.py | tee /tmp/phase09-clean-environment/phase05-exit.log
          python scripts/check_phase6_exit.py | tee /tmp/phase09-clean-environment/phase06-exit.log
          python scripts/check_phase7_contract.py | tee /tmp/phase09-clean-environment/phase07-contract.log
          python scripts/index_kb.py | tee /tmp/phase09-clean-environment/phase07-index.log
          python scripts/audit_phase7_leakage.py --output-dir /tmp/phase09-clean-environment/runtime-evidence | tee /tmp/phase09-clean-environment/phase07-leakage-audit.log
          python scripts/check_phase7_exit.py | tee /tmp/phase09-clean-environment/phase07-exit.log
          python scripts/index_phase8_rag_variants.py --output-dir /tmp/phase09-clean-environment/phase08-runtime-evidence | tee /tmp/phase09-clean-environment/phase08-index.log
          python scripts/check_phase8_exit.py | tee /tmp/phase09-clean-environment/phase08-exit.log
          python scripts/check_phase9_contract.py | tee /tmp/phase09-clean-environment/phase09-contract.log
          docker compose ps | tee /tmp/phase09-clean-environment/service-health.txt
      - name: Capture Compose logs
        if: always()
        run: docker compose logs --no-color > /tmp/phase09-clean-environment/compose.log || true
      - name: Tear down cleanly
        if: always()
        run: docker compose down -v --remove-orphans
      - name: Upload Phase 09 clean-environment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase09-clean-environment
          path: /tmp/phase09-clean-environment/
