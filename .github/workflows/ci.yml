name: phase3-bootstrap

on:
  push:
    branches:
      - phase-03-dataset-engineering

permissions:
  contents: write

jobs:
  materialize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: evalforge
          POSTGRES_USER: evalforge
          POSTGRES_PASSWORD: evalforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evalforge -d evalforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://evalforge:evalforge@localhost:5432/evalforge
      REDIS_URL: redis://localhost:6379/0
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract Phase 03 bundle
        run: |
          : > /tmp/phase3-bundle.tar.gz
          while read -r blob_sha expected_sha; do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob_sha}" --jq .content > /tmp/chunk.b64
            tr -d '\n' < /tmp/chunk.b64 | base64 -d > /tmp/chunk
            echo "${expected_sha}  /tmp/chunk" | sha256sum -c -
            cat /tmp/chunk >> /tmp/phase3-bundle.tar.gz
          done <<'CHUNKS'
          b32b6e7de31141140143dac34d2e832b8b57caed 7395062f9c1f8d544171af81e316c021441d1142817e0640c377fc31fd27b08d
          beea832b3061b7e8af2ad7dc8300fe52920566c6 3ed906289d9f94f516163850a65cf47fb747d050957ef462d4f33aca92fef4ce
          eaa263f65eedfe66f303f2899430d47afbc527bd 224df7c37be198f23dc1fdc7513519534a207d917d99499cfc03772beaf255d8
          0dada05f98fae7d0a5387113edd8a1ac3aa64257 acebac86af3853d9ffe1e81e470a34a125b4c431dbd62f16185a5b863e4e3337
          ecf919efc95df2652c91cc83f1053e4a02a4d7db f2ef96f4c280e7b8f6f538120a0a6a09346428e52f18c6e6d0f3ce9f87e01bde
          350bd12c8816fcece50ab6e07ddae66be510ed3a bb2bb4a2c0a39f7c3cbce6baccc1b24cacbd636fc3223bfa96b4d708b3bb6938
          CHUNKS
          echo "78d467ea9aeecaf3a875ebfeebd521ab258941c860ae5408b6498815de349748  /tmp/phase3-bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/phase3-bundle.tar.gz
          curl --fail --location --retry 3 \
            --output datasets/incident_diagnosis/raw/servicenow_uci/uci-498/incident-management-process-enriched-event-log.zip \
            "https://archive.ics.uci.edu/static/public/498/incident+management+process+enriched+event+log.zip"
          echo "3ea92768cb2cfada908dd601b057d7066127fe75dc8fe19e4abaa1c6766a6c13  datasets/incident_diagnosis/raw/servicenow_uci/uci-498/incident-management-process-enriched-event-log.zip" | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Verify committed dependency locks
        run: |
          python -m pip freeze --exclude-editable | sort > /tmp/backend.freeze
          diff -u backend/requirements.full.lock /tmp/backend.freeze
          test -f frontend/package-lock.json
      - name: Cumulative Phase 01-03 gate
        run: make verify-all
      - name: Verify expected Phase 03 scientific blocker
        run: |
          set +e
          python scripts/check_phase3_exit.py | tee /tmp/phase03-exit.txt
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 2
          grep -q '^BLOCKER=independent_incident_family_corpus_required$' /tmp/phase03-exit.txt
          grep -q '^AUXILIARY_REAL_INCIDENTS=24918$' /tmp/phase03-exit.txt
          grep -q '^BLOCKER_DETAIL=human_readable_root_cause_labels_required$' /tmp/phase03-exit.txt
      - name: Commit materialized Phase 03 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "phase3: engineer leakage-safe dataset sources and preserve ServiceNow provenance"
          git push origin HEAD:phase-03-dataset-engineering
