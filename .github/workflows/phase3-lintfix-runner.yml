name: phase3-lintfix-runner

on:
  push:
    branches:
      - phase-03-lintfix-runner

permissions:
  contents: write

jobs:
  lintfix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Phase 03 head
        uses: actions/checkout@v4
        with:
          ref: phase-03-dataset-engineering
          fetch-depth: 1

      - name: Verify expected parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "dfd5a59475fadd49ef51d06a23edfe1c8995f400"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock

      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend

      - name: Materialize pinned Phase 03 sources
        run: python scripts/fetch_phase3_sources.py

      - name: Apply only Ruff lint repairs
        shell: bash
        run: |
          cd backend
          ruff check --fix --unsafe-fixes \
            app/data/audit.py \
            app/data/hashing.py \
            app/data/servicenow.py \
            tests/data/test_phase3_data.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py
          ruff check \
            app/data/audit.py \
            app/data/hashing.py \
            app/data/servicenow.py \
            tests/data/test_phase3_data.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py

      - name: Run focused Phase 03 tests
        run: python -m pytest backend/tests/data/test_phase3_data.py -q

      - name: Validate exact changed-file scope
        shell: bash
        run: |
          git diff --check
          git diff --name-only > /tmp/changed.txt
          test -s /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              backend/app/data/audit.py|backend/app/data/hashing.py|backend/app/data/servicenow.py|backend/tests/data/test_phase3_data.py|scripts/build_phase3_candidate.py|scripts/check_phase3_contract.py|scripts/check_phase3_reproducibility.py|scripts/fetch_phase3_sources.py) ;;
              *) echo "unexpected changed path: $path"; exit 1 ;;
            esac
          done < /tmp/changed.txt
          cat /tmp/changed.txt

      - name: Commit verified lint-only repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/data/audit.py \
            backend/app/data/hashing.py \
            backend/app/data/servicenow.py \
            backend/tests/data/test_phase3_data.py \
            scripts/build_phase3_candidate.py \
            scripts/check_phase3_contract.py \
            scripts/check_phase3_reproducibility.py \
            scripts/fetch_phase3_sources.py
          git diff --cached --check
          git commit -m "phase3: fix lint gate"
          git push origin HEAD:phase-03-dataset-engineering
