name: phase3-lintfix-runner

on:
  push:
    branches:
      - phase-03-lintfix-runner

permissions:
  contents: write

jobs:
  typefix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact Phase 03 head
        uses: actions/checkout@v4
        with:
          ref: phase-03-dataset-engineering
          fetch-depth: 1

      - name: Verify expected parent
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "828f9570f118cf0e539f166fe6abc154ce9ca21d"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock

      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend

      - name: Materialize pinned Phase 03 sources
        run: python scripts/fetch_phase3_sources.py

      - name: Apply exact mypy annotation repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("backend/app/data/opssentinel.py")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    splits = Counter()\n": "    splits: Counter[str] = Counter()\n",
              "    labels = Counter()\n": "    labels: Counter[str] = Counter()\n",
              "    difficulties = Counter()\n": "    difficulties: Counter[str] = Counter()\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one source block: {old!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python quality gates
        shell: bash
        run: |
          cd backend
          ruff check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../training/dataset_prep.py
          ruff format --check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../training/dataset_prep.py
          mypy app

      - name: Run focused Phase 03 tests
        run: python -m pytest backend/tests/data/test_phase3_data.py -q

      - name: Validate exact changed-file scope
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only)" = "backend/app/data/opssentinel.py"
          git diff -- backend/app/data/opssentinel.py

      - name: Commit verified type-only repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/data/opssentinel.py
          git diff --cached --check
          git commit -m "phase3: annotate OpsSentinel counters"
          git push origin HEAD:phase-03-dataset-engineering
