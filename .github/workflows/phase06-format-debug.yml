name: phase06-format-debug

on:
  push:
    branches:
      - phase-06-zero-shot-baseline-pipeline

jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact Ruff
        run: python -m pip install ruff==0.12.0
      - name: Show canonical formatter diff
        run: ruff format --diff --config backend/pyproject.toml backend/tests/inference/test_phase6_base_model.py || true
