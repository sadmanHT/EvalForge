name: phase8-format-runner

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical formatting and remove temporary workflow
        run: |
          ruff format backend/app/inference/rag_runner.py backend/tests/integration/test_phase8_rag_runner.py
          rm .github/workflows/phase8-format-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/inference/rag_runner.py backend/tests/integration/test_phase8_rag_runner.py .github/workflows/phase8-format-runner.yml
          git commit -m "style: apply canonical Phase 08 runner formatting"
          git pull --rebase origin phase-08-rag-pipeline-controlled-ablations
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
