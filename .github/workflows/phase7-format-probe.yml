name: phase7-format-probe

on:
  push:
    branches:
      - phase-07-knowledge-base-retrieval-foundation

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.12.0
      - name: Show backend-config formatter diff
        run: |
          cd backend
          ruff format --diff ../scripts/audit_phase7_leakage.py
