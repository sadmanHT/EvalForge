name: phase04-format

on:
  push:
    branches:
      - phase-04-persistence-reproducibility-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-04-persistence-reproducibility-model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Install locked backend dependencies
        run: |
          python -m pip install -r backend/requirements.full.lock
          python -m pip install --no-deps -e ./backend
      - name: Canonicalize exact Phase 04 files
        run: |
          cd backend
          ruff check --fix \
            app/core/experiment_config.py \
            app/repositories/persistence.py \
            tests/integration/test_phase4_persistence.py \
            ../scripts/check_phase4_exit.py
          ruff format \
            app/core/experiment_config.py \
            app/repositories/persistence.py \
            tests/integration/test_phase4_persistence.py \
            ../scripts/check_phase4_exit.py
          cd ..
          git diff --check
      - name: Commit only allowlisted formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            backend/app/core/experiment_config.py \
            backend/app/repositories/persistence.py \
            backend/tests/integration/test_phase4_persistence.py \
            scripts/check_phase4_exit.py
          staged="$(git diff --cached --name-only)"
          test -n "$staged"
          printf '%s\n' "$staged" | grep -Ev '^(backend/app/core/experiment_config.py|backend/app/repositories/persistence.py|backend/tests/integration/test_phase4_persistence.py|scripts/check_phase4_exit.py)$' && exit 1 || true
          git commit -m "phase4 canonical ruff formatting"
          git push origin HEAD:phase-04-persistence-reproducibility-model
