name: phase8-format-backend-context

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-phase8-scripts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Format with backend Ruff configuration and remove temporary workflow
        run: |
          cd backend
          ruff format ../evals/rag_runner.py ../evals/rag_ablation_runner.py ../scripts/check_phase8_exit.py ../scripts/freeze_phase8_protocol.py
          cd ..
          rm .github/workflows/phase8-format-backend-context.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/rag_runner.py evals/rag_ablation_runner.py scripts/check_phase8_exit.py scripts/freeze_phase8_protocol.py .github/workflows/phase8-format-backend-context.yml
          git diff --cached --quiet && exit 0
          git commit -m "style: format Phase 08 scripts with backend config"
          git push
