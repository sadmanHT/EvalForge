name: phase8-fix-mypy

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  fix-phase8-mypy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair type narrowing, format, and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          indexing = Path('backend/app/retrieval/indexing.py')
          text = indexing.read_text()
          old = '''    expected_chunks = {item.chunk_id: item for item in plan.chunks}\n    for row in chunks:\n        expected = expected_chunks.get(row.chunk_id)\n        if expected is None:\n            raise ValueError("existing knowledge-base chunk is absent from the sealed index plan")\n        document = expected_documents[expected.document_id]\n        if (\n            row.document_id != expected.document_id\n            or row.chunk_index != expected.chunk_index\n            or row.text != expected.text\n            or row.source_family_id != expected.source_family_id\n            or row.chunk_metadata != _chunk_metadata(expected, document)\n            or not _embedding_matches(row.embedding, expected.embedding)\n        ):\n            raise ValueError("existing knowledge-base chunk disagrees with the sealed index plan")\n'''
          new = '''    expected_chunks = {item.chunk_id: item for item in plan.chunks}\n    for chunk_row in chunks:\n        expected_chunk = expected_chunks.get(chunk_row.chunk_id)\n        if expected_chunk is None:\n            raise ValueError("existing knowledge-base chunk is absent from the sealed index plan")\n        document = expected_documents[expected_chunk.document_id]\n        if (\n            chunk_row.document_id != expected_chunk.document_id\n            or chunk_row.chunk_index != expected_chunk.chunk_index\n            or chunk_row.text != expected_chunk.text\n            or chunk_row.source_family_id != expected_chunk.source_family_id\n            or chunk_row.chunk_metadata != _chunk_metadata(expected_chunk, document)\n            or not _embedding_matches(chunk_row.embedding, expected_chunk.embedding)\n        ):\n            raise ValueError("existing knowledge-base chunk disagrees with the sealed index plan")\n'''
          if old not in text:
              raise SystemExit('indexing replacement target not found')
          indexing.write_text(text.replace(old, new))

          evidence = Path('backend/app/inference/rag_evidence.py')
          text = evidence.read_text()
          marker = '''    return tuple(incident_ids)\n\n\ndef _validate_trace_contract(\n'''
          helper = '''    return tuple(incident_ids)\n\n\ndef _trace_rank(trace: Mapping[str, object]) -> int:\n    value = trace.get("rank")\n    if isinstance(value, bool) or not isinstance(value, int):\n        raise ValueError("RAG retrieval trace rank must be an integer")\n    return value\n\n\ndef _trace_included_in_prompt(trace: Mapping[str, object]) -> bool:\n    metadata = trace.get("metadata")\n    return isinstance(metadata, dict) and metadata.get("included_in_prompt") is True\n\n\ndef _validate_trace_contract(\n'''
          if marker not in text:
              raise SystemExit('rag evidence helper insertion target not found')
          text = text.replace(marker, helper, 1)
          text = text.replace('key=lambda item: int(item["rank"]),', 'key=_trace_rank,')
          text = text.replace(
              'ranks = tuple(int(item["rank"]) for item in incident_traces)',
              'ranks = tuple(_trace_rank(item) for item in incident_traces)',
          )
          text = text.replace(
              '''            if isinstance(item.get("metadata"), dict)\n            and item["metadata"].get("included_in_prompt") is True\n''',
              '''            if _trace_included_in_prompt(item)\n''',
          )
          evidence.write_text(text)
          PY
          cd backend
          python -m pip install ruff==0.12.0
          ruff check --fix app/retrieval/indexing.py app/inference/rag_evidence.py
          ruff format app/retrieval/indexing.py app/inference/rag_evidence.py
          cd ..
          rm .github/workflows/phase8-fix-mypy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/retrieval/indexing.py backend/app/inference/rag_evidence.py .github/workflows/phase8-fix-mypy.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: satisfy Phase 08 evidence type contracts"
          git push
