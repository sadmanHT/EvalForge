name: phase8-format-diagnostic

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical Phase 08 formatting and remove diagnostic workflow
        run: |
          ruff format backend/app/inference/rag_pipeline.py backend/tests/inference/test_phase8_rag_pipeline.py
          rm .github/workflows/phase8-format-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/inference/rag_pipeline.py backend/tests/inference/test_phase8_rag_pipeline.py .github/workflows/phase8-format-diagnostic.yml
          git commit -m "style: apply canonical Phase 08 formatting"
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
