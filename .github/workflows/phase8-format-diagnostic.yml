name: phase8-format-diagnostic

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.12.0
      - name: Show Phase 08 formatter diff
        run: |
          ruff format --diff backend/app/inference/rag_pipeline.py backend/tests/inference/test_phase8_rag_pipeline.py || true
