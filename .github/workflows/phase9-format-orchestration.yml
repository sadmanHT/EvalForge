name: phase9-format-orchestration

on:
  push:
    branches:
      - phase-09-fine-tuning-system

permissions:
  contents: write

jobs:
  format-phase9-orchestration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical formatting and remove helper
        run: |
          cd backend
          ruff format app/training/orchestration.py
          cd ..
          rm .github/workflows/phase9-format-orchestration.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/training/orchestration.py .github/workflows/phase9-format-orchestration.yml
          git commit -m "style: format phase09 production orchestration"
          git push
