name: phase8-publish-validation-freeze

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations
    paths:
      - .github/workflows/phase8-publish-validation-freeze.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore accepted Phase 08 validation evidence and freeze
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/phase8-freeze-evidence.b64 <<'EOF'
[...truncated...]
EOF
          base64 -d /tmp/phase8-freeze-evidence.b64 > /tmp/phase8-freeze-evidence.tgz
          echo '04a1674c29c920ca5abbb21451da33df722bde916f32a17639e74f136c35247b  /tmp/phase8-freeze-evidence.tgz' | sha256sum -c -
          tar -xzf /tmp/phase8-freeze-evidence.tgz -C .

          python - <<'PY'
          import json
          from pathlib import Path
          protocol = json.loads(Path('configs/phase8-rag.json').read_text())
          report = json.loads(Path('evidence/phase-08/ablation-report.json').read_text())
          freeze = json.loads(Path('evidence/phase-08/protocol-freeze.json').read_text())
          expected = 'rag-top-k1'
          assert protocol['state'] == 'frozen'
          assert protocol['locked_test_authorized'] is True
          assert protocol['selected_variant_id'] == expected
          assert report['selected_variant_id'] == expected
          assert freeze['selected_variant_id'] == expected
          assert freeze['locked_test_authorized'] is True
          assert len(freeze['validation_evidence']) == 7
          print('PHASE08_VALIDATION_FREEZE_BUNDLE=PASS')
          PY

      - name: Commit accepted validation evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configs/phase8-rag.json evidence/phase-08
          git rm .github/workflows/phase8-publish-validation-freeze.yml
          git commit -m 'phase8: freeze validation-selected RAG protocol'
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
