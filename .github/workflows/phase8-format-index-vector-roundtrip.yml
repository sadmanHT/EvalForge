name: phase8-format-index-vector-roundtrip

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  format-index-vector-roundtrip:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Format with backend Ruff configuration and remove temporary workflow
        run: |
          cd backend
          ruff format app/retrieval/indexing.py
          cd ..
          rm .github/workflows/phase8-format-index-vector-roundtrip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/retrieval/indexing.py .github/workflows/phase8-format-index-vector-roundtrip.yml
          git commit -m 'style: format pgvector round-trip validator'
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
