name: phase03-research-lock

on:
  push:
    branches:
      - phase-03-research-dataset-lock

permissions:
  contents: write

jobs:
  build-and-validate:
    if: ${{ github.event.head_commit.message != 'phase3-research-lock-generated' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-03-research-dataset-lock
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Verify validated preservation base and install toolchain
        run: |
          git merge-base --is-ancestor 1f26372f90ca4acf834fc5843849fa6fea5d49c4 HEAD
          python -m pip install -r backend/requirements.full.lock
      - name: Materialize transport-only Phase 03 sources
        run: python scripts/fetch_phase3_sources.py
      - name: Migrate exact admission expectations
        run: python scripts/phase3_research_lock_migrate_expectations.py
      - name: Apply explicit research admission
        env:
          PYTHONPATH: backend
        run: python scripts/admit_phase3_research_records.py --apply
      - name: Rebuild candidate and locked research artifacts
        env:
          PYTHONPATH: backend
        run: |
          python scripts/build_phase3_candidate.py
          python scripts/build_phase3_research_dataset.py
      - name: Canonical Ruff fixes and formatting
        working-directory: backend
        run: |
          ruff check --fix \
            app/data/postmortems.py \
            app/data/research.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            tests/data/test_phase3_research_dataset.py \
            ../scripts/admit_phase3_research_records.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/build_phase3_research_dataset.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_research_reproducibility.py \
            ../scripts/sync_phase3_evidence.py
          ruff format \
            app/data/postmortems.py \
            app/data/research.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            tests/data/test_phase3_research_dataset.py \
            ../scripts/admit_phase3_research_records.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/build_phase3_research_dataset.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_research_reproducibility.py \
            ../scripts/sync_phase3_evidence.py
      - name: Cumulative static gates
        working-directory: backend
        run: |
          ruff check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/admit_phase3_research_records.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/build_phase3_research_dataset.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/check_phase3_research_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
          ruff format --check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/admit_phase3_research_records.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/build_phase3_research_dataset.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/check_phase3_research_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
          mypy app
      - name: Focused Phase 03 data tests
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/data/test_phase3_data.py \
            backend/tests/data/test_phase3_primary_sources.py \
            backend/tests/data/test_phase3_research_dataset.py \
            --cov=app.data --cov-report=term-missing --cov-fail-under=90 -q
      - name: Verify admission preservation reproducibility and hard exit
        env:
          PYTHONPATH: backend
        run: |
          python scripts/admit_phase3_research_records.py
          python scripts/preserve_phase3_primary_sources.py
          python scripts/check_phase3_reproducibility.py
          python scripts/check_phase3_research_reproducibility.py
          python scripts/check_phase3_contract.py
          python scripts/check_phase3_exit.py | tee /tmp/phase03-exit.txt
          grep -q '^PHASE03_EXIT_GATE=PASS$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_RECORDS=18$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_FAMILIES=18$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_TRAIN=6$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_VALIDATION=6$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_TEST=6$' /tmp/phase03-exit.txt
          grep -q '^SYNTHETIC_BASE_RECORDS=0$' /tmp/phase03-exit.txt
          grep -q '^LEAKAGE_ERRORS=0$' /tmp/phase03-exit.txt
      - name: Stage generated permanent research state only
        shell: bash
        run: |
          rm -f datasets/incident_diagnosis/raw/opssentinel/fae661fc1634aad6a3855a1dec8dcddb16a890dd/release-catalog.snapshot.json
          rm -f datasets/incident_diagnosis/raw/servicenow_uci/uci-498/incident-management-process-enriched-event-log.zip
          git add \
            configs/postmortem-candidates.json \
            backend/app/data/postmortems.py \
            backend/app/data/research.py \
            backend/tests/data/test_phase3_data.py \
            backend/tests/data/test_phase3_primary_sources.py \
            backend/tests/data/test_phase3_research_dataset.py \
            scripts/admit_phase3_research_records.py \
            scripts/build_phase3_candidate.py \
            scripts/build_phase3_research_dataset.py \
            scripts/check_phase3_contract.py \
            scripts/check_phase3_exit.py \
            scripts/check_phase3_research_reproducibility.py \
            scripts/sync_phase3_evidence.py \
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate \
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0
          git diff --cached --name-only | tee /tmp/staged.txt
          test -s /tmp/staged.txt
          ! grep -q '^.github/workflows/' /tmp/staged.txt
          ! grep -q 'phase3_research_lock_migrate_expectations.py' /tmp/staged.txt
          ! grep -q '^datasets/incident_diagnosis/raw/opssentinel/' /tmp/staged.txt
          ! grep -q '^datasets/incident_diagnosis/raw/servicenow_uci/' /tmp/staged.txt
      - name: Commit generated research lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'phase3-research-lock-generated'
          git push origin HEAD:phase-03-research-dataset-lock
