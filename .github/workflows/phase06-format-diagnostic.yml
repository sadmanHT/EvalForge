name: phase06-format-diagnostic

on:
  push:
    branches:
      - phase-06-zero-shot-baseline-pipeline

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.12.0
      - name: Show exact Ruff formatting diff
        run: |
          cd backend
          ruff format --diff app/results.py tests/integration/test_phase6_baseline_runner.py
