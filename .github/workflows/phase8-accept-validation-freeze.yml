name: phase8-accept-validation-freeze

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations
    paths:
      - .github/workflows/phase8-accept-validation-freeze.yml

permissions:
  contents: write

jobs:
  accept-validation-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 1
      - name: Diagnose reviewed Phase 08 payload
        shell: bash
        run: |
          set -euo pipefail
          wc -c .phase8_payload/part*.txt
          sha256sum .phase8_payload/part*.txt
          for p in .phase8_payload/part*.txt; do
            if LC_ALL=C grep -n '[^A-Za-z0-9+/=]' "$p"; then
              echo "INVALID_BASE64_CHARACTERS=$p"
            fi
          done
          cat .phase8_payload/part*.txt > /tmp/phase8_payload.b64
          wc -c /tmp/phase8_payload.b64
          base64 -d /tmp/phase8_payload.b64 > /tmp/phase8_payload.tgz
          sha256sum /tmp/phase8_payload.tgz
