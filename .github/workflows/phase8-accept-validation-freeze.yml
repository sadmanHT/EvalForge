name: phase8-accept-validation-freeze

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations
    paths:
      - .github/workflows/phase8-accept-validation-freeze.yml

permissions:
  contents: write

jobs:
  accept-validation-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 1
      - name: Materialize reviewed Phase 08 validation and freeze
        shell: bash
        run: |
          set -euo pipefail
          cat .phase8_payload/part*.txt > /tmp/phase8_payload.b64
          base64 -d /tmp/phase8_payload.b64 > /tmp/phase8_payload.tgz
          echo '97a18753fd2ef59b2232f8745140e1040b63da05479c23f7278c021a9c2c47a8  /tmp/phase8_payload.tgz' | sha256sum -c -
          tar -xzf /tmp/phase8_payload.tgz -C .
          git diff --check
          rm -rf .phase8_payload
          rm -f .github/workflows/phase8-accept-validation-freeze.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No staged Phase 08 changes'; exit 1; }
          git commit -m 'research: accept Phase 08 validation and freeze protocol'
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
