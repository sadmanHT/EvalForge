name: phase8-fix-index-vector-roundtrip

on:
  push:
    branches:
      - phase-08-rag-pipeline-controlled-ablations

permissions:
  contents: write

jobs:
  patch-index-validation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-08-rag-pipeline-controlled-ablations
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch serialized pgvector comparison and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/app/retrieval/indexing.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _embedding_matches(stored: list[float] | None, expected: list[float]) -> bool:\n    if stored is None or len(stored) != len(expected):\n        return False\n    return all(\n        abs(float(actual) - target) <= 1e-6\n        for actual, target in zip(stored, expected, strict=False)\n    )\n'''
          new = '''def _embedding_matches(\n    stored: list[float] | str | None, expected: list[float]\n) -> bool:\n    if stored is None:\n        return False\n    if isinstance(stored, str):\n        serialized = stored.strip()\n        if not (serialized.startswith("[") and serialized.endswith("]")):\n            return False\n        body = serialized[1:-1].strip()\n        try:\n            stored_values = [] if not body else [float(value) for value in body.split(",")]\n        except ValueError:\n            return False\n    else:\n        stored_values = stored\n    if len(stored_values) != len(expected):\n        return False\n    return all(\n        abs(float(actual) - target) <= 1e-6\n        for actual, target in zip(stored_values, expected, strict=False)\n    )\n'''
          if old not in text:
              raise SystemExit('expected _embedding_matches block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/phase8-fix-index-vector-roundtrip.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/retrieval/indexing.py .github/workflows/phase8-fix-index-vector-roundtrip.yml
          git commit -m 'fix: validate persisted pgvector embeddings after round trip'
          git push origin HEAD:phase-08-rag-pipeline-controlled-ablations
