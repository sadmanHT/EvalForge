name: phase03-primary-source-wave3

on:
  push:
    branches:
      - phase-03-primary-source-preservation-wave3

permissions:
  contents: write

jobs:
  preserve-and-validate:
    if: ${{ github.event.head_commit.message != 'phase3-primary-source-wave3-final' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-03-primary-source-preservation-wave3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.full.lock
      - name: Verify validated base and install toolchain
        run: |
          git merge-base --is-ancestor 90c5501da18c2ab74bdc96623a671d30580dc8bf HEAD
          python -m pip install -r backend/requirements.full.lock
      - name: Materialize transport-only Phase 03 sources
        run: python scripts/fetch_phase3_sources.py
      - name: Migrate exact wave3 expectations
        run: python scripts/phase3_wave3_migrate_expectations.py
      - name: Preserve six final public primary documents
        env:
          PYTHONPATH: backend
        run: python scripts/preserve_phase3_primary_sources.py --bootstrap
      - name: Rebuild candidate evidence
        env:
          PYTHONPATH: backend
        run: |
          python scripts/build_phase3_candidate.py
          python scripts/sync_phase3_evidence.py
      - name: Canonical Ruff fixes and formatting
        working-directory: backend
        run: |
          ruff check --fix \
            app/data/primary_sources.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/preserve_phase3_primary_sources.py
          ruff format \
            app/data/primary_sources.py \
            tests/data/test_phase3_data.py \
            tests/data/test_phase3_primary_sources.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/preserve_phase3_primary_sources.py
      - name: Cumulative static gates
        working-directory: backend
        run: |
          ruff check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
          ruff format --check \
            app tests \
            ../scripts/audit_dataset.py \
            ../scripts/build_phase3_candidate.py \
            ../scripts/check_phase3_contract.py \
            ../scripts/check_phase3_exit.py \
            ../scripts/check_phase3_reproducibility.py \
            ../scripts/fetch_phase3_sources.py \
            ../scripts/preserve_phase3_primary_sources.py \
            ../scripts/sync_phase3_evidence.py \
            ../training/dataset_prep.py
          mypy app
      - name: Focused Phase 03 tests and contracts
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest \
            backend/tests/data/test_phase3_data.py \
            backend/tests/data/test_phase3_primary_sources.py \
            --cov=app.data --cov-report=term-missing --cov-fail-under=90 -q
          python scripts/preserve_phase3_primary_sources.py | tee /tmp/preservation.txt
          grep -q '^PRESERVED_CANDIDATES=18$' /tmp/preservation.txt
          grep -q '^PRESERVED_BROKEN_PAYMENT_CONFIGURATION=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_DATABASE_CONNECTION_LEAK=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_DISK_EXHAUSTION=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_MEMORY_LEAK=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_N_PLUS_ONE_QUERY=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_NO_FAULT=3$' /tmp/preservation.txt
          grep -q '^PRESERVED_FAMILY_DEPTH_SUFFICIENT=true$' /tmp/preservation.txt
          python scripts/check_phase3_reproducibility.py
          python scripts/check_phase3_contract.py
      - name: Verify scientific hard exit remains blocked only on canonical admission
        shell: bash
        run: |
          set +e
          python scripts/check_phase3_exit.py | tee /tmp/phase03-exit.txt
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 2
          grep -q '^BLOCKER=original_source_preservation_and_research_admission_required$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_TRAIN=0$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_VALIDATION=0$' /tmp/phase03-exit.txt
          grep -q '^RESEARCH_TEST=0$' /tmp/phase03-exit.txt
      - name: Stage permanent validated files only
        shell: bash
        run: |
          rm -f datasets/incident_diagnosis/raw/opssentinel/fae661fc1634aad6a3855a1dec8dcddb16a890dd/release-catalog.snapshot.json
          rm -f datasets/incident_diagnosis/raw/servicenow_uci/uci-498/incident-management-process-enriched-event-log.zip
          git add \
            backend/tests/data/test_phase3_data.py \
            backend/tests/data/test_phase3_primary_sources.py \
            configs/phase3-primary-sources.json \
            configs/postmortem-candidates.json \
            scripts/check_phase3_contract.py \
            scripts/preserve_phase3_primary_sources.py \
            datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/SHA256SUMS.txt \
            datasets/incident_diagnosis/raw/public_incidents/phase3-candidate-v1/elevenlabs-2026-04-22-payment-configuration.snapshot.json \
            datasets/incident_diagnosis/raw/public_incidents/phase3-primary-source-v1 \
            datasets/incident_diagnosis/processed/evalforge-incident-diagnosis-v0.1.0-candidate \
            evidence/phase-03
          git diff --cached --name-only | tee /tmp/staged.txt
          test -s /tmp/staged.txt
          ! grep -q '^.github/workflows/' /tmp/staged.txt
          ! grep -q 'phase3_wave3_migrate_expectations.py' /tmp/staged.txt
          ! grep -q '^datasets/incident_diagnosis/raw/opssentinel/' /tmp/staged.txt
          ! grep -q '^datasets/incident_diagnosis/raw/servicenow_uci/' /tmp/staged.txt
          ! grep -q 'visa-cybersource.*primary' /tmp/staged.txt
      - name: Commit validated wave
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'phase3-primary-source-wave3-final'
          git push origin HEAD:phase-03-primary-source-preservation-wave3
