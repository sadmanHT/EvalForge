name: phase6-format-helper

on:
  push:
    branches:
      - phase-06-zero-shot-baseline-pipeline

permissions:
  contents: write

jobs:
  format-phase6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-06-zero-shot-baseline-pipeline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.12.0
      - name: Apply canonical formatting
        run: |
          ruff format backend/app/inference/evidence.py backend/app/inference/phase6_gate.py
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet -- backend/app/inference/evidence.py backend/app/inference/phase6_gate.py; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/inference/evidence.py backend/app/inference/phase6_gate.py
          git commit -m "Phase 06: apply canonical Ruff formatting"
          git push origin HEAD:phase-06-zero-shot-baseline-pipeline
